name: Synchronisation Deezer ⇄ Spotify

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 minutes (GitHub peut décaler de quelques minutes)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["sync/pairs/**"]  # dès qu'une playlist est ajoutée à la synchro

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Spotify peut renouveler le jeton à chaque utilisation : on garde le dernier, chiffré avec SYNC_KEY.
      - name: Récupérer le dernier jeton Spotify
        uses: actions/cache/restore@v4
        with:
          path: .token.enc
          key: spotify-token-${{ github.run_id }}
          restore-keys: spotify-token-

      - name: Synchroniser
        env:
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: python3 sync/sync.py

      - name: Conserver le jeton Spotify
        if: ${{ always() && hashFiles('.token.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .token.enc
          key: spotify-token-${{ github.run_id }}

      - name: Publier l'état
        if: ${{ always() }}
        run: |
          git config user.name "passe-playlist-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync/state
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Synchro : mise à jour de l'état"
            git pull --rebase --quiet origin main
            git push
          fi
